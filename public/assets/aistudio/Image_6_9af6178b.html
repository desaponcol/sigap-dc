<body class="bg-surface font-body text-on-surface min-h-screen flex flex-col relative overflow-hidden">
<!-- Texture Layer -->
<div class="fixed inset-0 pointer-events-none grain-texture"></div>
<!-- Decorative Elements -->
<div class="absolute top-[-10%] right-[-10%] w-[40%] h-[40%] bg-primary-fixed/20 rounded-full blur-[120px]"></div>
<div class="absolute bottom-[-10%] left-[-10%] w-[40%] h-[40%] bg-secondary-container/20 rounded-full blur-[120px]"></div>
<main class="flex-grow flex items-center justify-center p-6 relative z-10">
<div class="w-full max-w-md">
<!-- Brand Identity -->
<div class="text-center mb-10">
<div class="inline-flex items-center justify-center w-20 h-20 rounded-[2rem] bg-gradient-to-br from-primary to-primary-container shadow-2xl mb-6 transform rotate-3">
<span class="material-symbols-outlined text-white text-4xl" data-weight="fill">shield_person</span>
</div>
<h1 class="font-headline text-4xl font-extrabold tracking-tight text-primary mb-2">SIGAP</h1>
<p class="font-label text-xs uppercase tracking-[0.2em] text-secondary font-semibold">Digital Concierge</p>
</div>
<!-- Login Card -->
<div class="bg-surface-container-lowest rounded-[2rem] p-8 shadow-[0_20px_50px_rgba(28,28,23,0.05)] border border-outline-variant/10">
<div class="mb-8">
<h2 class="font-headline text-2xl font-bold text-on-surface mb-1">Welcome back</h2>
<p class="text-on-surface-variant text-sm">Please enter your credentials to continue.</p>
</div>
<form class="space-y-6">
<!-- Email Field -->
<div class="space-y-2">
<label class="block font-label text-[10px] font-bold uppercase tracking-widest text-secondary ml-1" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline text-xl">mail</span>
<input class="w-full pl-12 pr-4 py-4 bg-surface-container-low border-none rounded-xl text-on-surface placeholder:text-outline/50 focus:ring-2 focus:ring-primary/20 transition-all text-sm" id="email" name="email" placeholder="name@company.com" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<div class="flex justify-between items-center px-1">
<label class="font-label text-[10px] font-bold uppercase tracking-widest text-secondary" for="password">Password</label>
<a class="text-[10px] font-bold uppercase tracking-widest text-primary hover:text-primary-container transition-colors" href="#">Lupa Password?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline text-xl">lock</span>
<input class="w-full pl-12 pr-12 py-4 bg-surface-container-low border-none rounded-xl text-on-surface placeholder:text-outline/50 focus:ring-2 focus:ring-primary/20 transition-all text-sm" id="password" name="password" placeholder="••••••••" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline" type="button">
<span class="material-symbols-outlined text-xl">visibility</span>
</button>
</div>
</div>
<!-- Action Button -->
<div class="pt-2">
<button class="w-full h-14 bg-gradient-to-r from-primary to-primary-container text-white font-headline font-bold rounded-xl shadow-lg shadow-primary/20 active:scale-95 transition-all flex items-center justify-center gap-2 group" type="submit">
                            Masuk
                            <span class="material-symbols-outlined group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
</div>
</form>
<!-- Footer Separator -->
<div class="mt-8 pt-8 border-t border-outline-variant/10 text-center">
<p class="text-on-surface-variant text-xs">Don't have an account? <a class="text-primary font-bold hover:underline" href="#">Contact Admin</a></p>
</div>
</div>
</div>
</main>
<!-- Global Footer -->
<footer class="p-8 text-center relative z-10">
<div class="flex items-center justify-center gap-4 mb-4">
<div class="h-px w-8 bg-outline-variant/30"></div>
<p class="font-label text-[10px] uppercase tracking-widest text-outline">v1.0.0 Prestige Edition</p>
<div class="h-px w-8 bg-outline-variant/30"></div>
</div>
<p class="text-[10px] text-on-surface-variant/60 font-medium">© 2024 SIGAP Security Ecosystem. All Rights Reserved.</p>
