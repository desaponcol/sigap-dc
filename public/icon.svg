<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5C4300" />
      <stop offset="50%" stop-color="#8A6800" />
      <stop offset="100%" stop-color="#B8860B" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E1A14" />
      <stop offset="100%" stop-color="#0F0C08" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="100%" stop-color="#D4AF37" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background with rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#goldGrad)" />

  <!-- Inner border ring -->
  <rect x="24" y="24" width="464" height="464" rx="92" fill="none" stroke="#FFE9A8" stroke-width="4" stroke-opacity="0.4" />

  <!-- Central Shield -->
  <g filter="url(#shadow)">
    <path d="M 256 80 L 380 130 C 380 270 256 360 256 400 C 256 360 132 270 132 130 Z" fill="url(#shieldGrad)" stroke="url(#accentGrad)" stroke-width="8" />
  </g>

  <!-- Geofence Radar Rings inside shield -->
  <circle cx="256" cy="220" r="75" fill="none" stroke="#D4AF37" stroke-width="3" stroke-dasharray="6 6" stroke-opacity="0.6" />
  <circle cx="256" cy="220" r="50" fill="none" stroke="#FFE082" stroke-width="3" stroke-opacity="0.8" />
  <circle cx="256" cy="220" r="24" fill="#D4AF37" fill-opacity="0.25" />

  <!-- Location Pin Emblem -->
  <path d="M 256 160 C 235 160 218 177 218 198 C 218 226 256 268 256 268 C 256 268 294 226 294 198 C 294 177 277 160 256 160 Z" fill="url(#accentGrad)" />
  <circle cx="256" cy="198" r="10" fill="#1E1A14" />

  <!-- Verified Checkmark Badge at Bottom of Pin -->
  <g transform="translate(256, 305)">
    <circle cx="0" cy="0" r="28" fill="#15803D" stroke="#DCFCE7" stroke-width="4" />
    <path d="M -12 -1 L -4 7 L 12 -9" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Typography at bottom: SIGAP -->
  <text x="256" y="455" font-family="'Manrope', -apple-system, sans-serif" font-size="34" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.18em">SIGAP DESA</text>
</svg>
